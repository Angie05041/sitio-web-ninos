<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina Niños</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com"> <!--rendimiento coencta con gogogle ya y 
    el de abajotambien-->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;900&display=swap" 
    rel="stylesheet"> <!--letra o fuente-->
    <link rel="preload" as="image" href="img/background2.png"> <!--la descargamos de una vez para que no tenga problemas con el cover o el 100--> 
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="portada"> 
        <!--parte de arriba donde digamos qeu lo primero-->
        <nav class="container d-flex justify-content-between align-items-center flex-wrap pt-4">
            <!--menu que vamso a desplegar para logo y lo que vayamos a poner, container entonces me pone contenido 
            y deja espacio a los lados, d-flex como ya sabemos en el flexbox, entonces pone justificadouno al lado 
            del otro , justify el logo lo manda a la izquierda y el menu a la derecha con un espacio en el medio, align 
            Alinea todo a la misma altura , flex si no cabe, entonces ponlo en la siguiente para que se vea bien y por 
            ultimo pt- como el regalo lindo con el padding , t de top arriba y 4 con el tamaño. -->
            <a href="#" class="logo">NO_BURBUJA.COM</a> 
             <!-- ponemos este link para volver a el inicio-->
            <ul class="menu d-flex gap-5 m-0 p-0"> <!--lista del menu , 3 opciones , d-flex pone todo en fila
                no una bajo otra , gap, espacio entre cada una de las cosas de la lista , m-0 p-o quitamos la margen y el 
                relleno que tre la lista por defecto margen y padding = 0 o sea nada.-->
                <li><a href="#que-es">NOSOTROS</a></li> <!--opciones del menu con la lista, li es lista, jeje -->
                <li><a href="#catalogo">DESCUENTOS</a></li> 
                <li><a href="#contacto">CONTACTO</a></li>
            </ul>
        </nav>
        <div class="container contenido-portada"> 
            <!--container centrado y contenido-portada entonces es el 
            que da espacio una de otra de la de arriba de portada pues-->
            <div class="row"> <!--es una fila de la cuadricula de boots-->
                <div class="col-12 col-md-6"> 
                    <!-- como el boots divide todo en 12 partes, aqui vamos a hacer
                    un columna, entonces col-12 que ocupe todo el ancho de la pantalla en celular, col-md-6
                     para que ocupe la mitad pero en computador, como un responsive -->
                    <h1 class="titulo-portada">POP IT!</h1> 
                    <!--titulo nomal h1-->
                    <p class="subtitulo-portada">¡El mejor juguete antiestrés: plástico de burbujas infinito!</p>
                    <a href="#catalogo" class="btn boton-comprar">COMPRAR</a> 
                    <!--aqui ponemos un boton por medio 
                    de un enlace , btn es del boot y le da la formita del boton, y el comprar es color menta, href nos 
                    baja o dirije a los productos-->
                </div>
            </div>
        </div>
    </header>
</body>
</html>
